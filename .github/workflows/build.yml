name: Build TENET Hub

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.0.0 && git push --tags  -> a Release with TenetHub.exe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Check the catalogue is up to date
        run: |
          python tools/build_index.py
          git diff --exit-code -- index.json catalog
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole --name TenetHub
          --paths app --add-data "packages;packages"
          --collect-all winrt --collect-all soundcard --collect-submodules pystray
          --hidden-import hub._bundle --collect-submodules hub
          app/tenet_hub.py
      - name: Self-test the built exe (loads every bundled package inside the exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/TenetHub.exe -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path selftest.ok)) { Write-Error "exe self-test failed (exit $($p.ExitCode))"; exit 1 }
          Get-Content selftest.ok
      - uses: actions/upload-artifact@v4
        with:
          name: TenetHub
          path: dist/TenetHub.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TenetHub.exe
